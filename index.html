<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五年級數學｜倍數與因數互動教學</title>
<style>
:root{
  --ink:#1d2a30; --ink-soft:#5a6c74; --paper:#eef3f5; --card:#fff; --line:#ccd8dd;
  --deep:#1f5d70; --gold:#d99b22; --coral:#cf5b41; --sky:#3d8ba6; --plum:#6f5090; --ok:#2d7a59;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"標楷體","DFKai-SB","BiauKai","Noto Serif TC",serif;
  font-size:20px;line-height:2.0;-webkit-text-size-adjust:100%}
.wrap{max-width:800px;margin:0 auto;padding:16px 16px 64px}

/* 注音：只加在指導語與題幹（評量的是數學，不是識字）；數字與算式本來就沒有 */
.rb{position:relative;display:inline-block;padding-right:.75em;line-height:1}
.rb>.rt{position:absolute;right:0;top:.05em;font-size:.36em;line-height:1;padding-right:.9em;
  white-space:nowrap;color:var(--ink-soft);pointer-events:none;font-family:"標楷體","DFKai-SB",serif}
.rb>.rt>.zs{display:inline-block;writing-mode:vertical-lr;text-orientation:upright;line-height:1;white-space:nowrap}
.rb>.rt>.tn{position:absolute;right:0;top:50%;transform:translateY(-50%);writing-mode:horizontal-tb;line-height:1}
.rb.miss{background:#ffe9a8}
body.no-zhuyin .rb{padding-right:0}
body.no-zhuyin .rb>.rt{display:none}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-size:.88rem;line-height:2.2;color:var(--ink-soft)}
.toggle{border:2px solid var(--deep);background:transparent;color:var(--deep);border-radius:999px;
  padding:5px 14px;font-family:inherit;font-size:.82rem;line-height:2.2;cursor:pointer}
.toggle[aria-pressed="false"]{background:var(--deep);color:#fff}
.screen{display:none} .screen.on{display:block}

.hero{background:var(--deep);color:#fff;border-radius:24px;padding:22px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;bottom:-70px;width:200px;height:200px;
  border-radius:50%;background:rgba(217,155,34,.18)}
.hero h1{margin:0 0 6px;font-size:1.7rem;line-height:2.05}
.hero p{margin:0;color:#cbe1e8;font-size:.92rem;line-height:2.1}
.hero .rb>.rt{color:#9cc2d0}

.unit{margin-top:20px;font-size:.85rem;line-height:2.2;color:var(--ink-soft);
  border-bottom:2px solid var(--line);padding-bottom:2px}
.grid{display:grid;gap:10px;margin-top:10px}
.ch{display:block;width:100%;text-align:left;cursor:pointer;border:3px solid var(--line);
  border-radius:18px;background:var(--card);padding:12px 16px;font-family:inherit;color:var(--ink)}
.ch .nm{font-size:1.12rem;line-height:2.05}
.ch .meta{margin-top:2px;font-size:.78rem;line-height:1.9;color:var(--ink-soft)}
.ch.done{border-color:var(--ok);background:#f1f9f5}
.ch:active{transform:translateY(2px)}

.btn{margin-top:13px;width:100%;cursor:pointer;border:none;border-radius:16px;background:var(--deep);
  color:#fff;padding:12px 15px;font-family:inherit;font-size:1.12rem;line-height:2.05}
.btn .rb>.rt{color:#9cc2d0}
.btn.ghost{background:transparent;color:var(--deep);border:3px solid var(--deep)}
.btn.ghost .rb>.rt{color:var(--ink-soft)}
.btn.gold{background:var(--gold);color:#3a2a06} .btn.gold .rb>.rt{color:#7a5c14}
.btn.hint{background:var(--sky)} .btn.hint .rb>.rt{color:#cfe6ee}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.toggle:focus-visible,.ch:focus-visible{outline:4px solid var(--gold);outline-offset:2px}

.panel{margin-top:18px;border:2px solid var(--line);border-radius:16px;background:#fafcfd;overflow:hidden}
.panel>summary{cursor:pointer;padding:9px 16px;font-size:.86rem;line-height:2.1;background:#e7eef1;
  color:var(--ink-soft);list-style:none}
.panel>summary::-webkit-details-marker{display:none}
.pbody{padding:10px 18px 14px;font-size:.85rem;line-height:2.0}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0}
.seg{display:inline-flex;border:2px solid var(--sky);border-radius:999px;overflow:hidden}
.seg button{border:none;background:#fff;color:var(--sky);font-family:inherit;font-size:.82rem;
  line-height:2.0;padding:2px 12px;cursor:pointer}
.seg button.on{background:var(--sky);color:#fff}

.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:.82rem;line-height:2.2;color:var(--ink-soft);margin-bottom:6px}
.lvtag{border-radius:999px;padding:2px 13px;font-size:.8rem;line-height:2.1;color:#fff}
.lv0{background:var(--plum)} .lv1{background:var(--sky)} .lv2{background:var(--deep)}
.bar{height:9px;background:#dbe5e9;border-radius:999px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}

.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px}
.say{background:#fdf6e6;border:2px dashed var(--gold);border-radius:16px;padding:11px 16px;
  font-size:1.05rem;line-height:2.3;margin-bottom:12px}
.keypoint{background:#e9f2f6;border:2px solid var(--sky);border-radius:14px;padding:10px 16px;
  font-size:1.02rem;line-height:2.3;margin-bottom:12px}
.stage{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 8px 6px;
  margin-bottom:12px;overflow-x:auto}
.stage svg{display:block;width:100%;height:auto;min-width:260px}
.qtext{font-size:1.24rem;line-height:2.35;margin:4px 0 12px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:11px;width:100%;cursor:pointer;border:3px solid var(--line);
  border-radius:16px;background:#fff;padding:10px 15px;font-family:inherit;font-size:1.22rem;
  line-height:2.05;color:var(--ink);text-align:left}
.opt .tag{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--paper);
  display:grid;place-items:center;font-size:.98rem;color:var(--ink-soft)}
.opt.right{border-color:var(--ok);background:#eaf6f0} .opt.right .tag{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--coral);background:#fdeeeb} .opt.wrong .tag{background:var(--coral);color:#fff}
.feedback{margin-top:12px;border-radius:16px;padding:11px 16px;font-size:1rem;line-height:2.3}
.feedback.good{background:#eaf6f0;border:2px solid var(--ok)}
.feedback.bad{background:#fdeeeb;border:2px solid var(--coral)}
.shift{margin-top:12px;border-radius:14px;padding:10px 16px;font-size:.95rem;line-height:2.2;
  background:#f3eefa;border:2px solid var(--plum);color:#4a3563}

/* 位值表 */
.pv{width:100%;border-collapse:collapse;font-size:1.05rem;background:#fff}
.pv th,.pv td{border:2px solid var(--line);padding:5px 4px;text-align:center;line-height:2.0}
.pv th{background:#e7eef1;font-size:.8rem;font-weight:normal;color:var(--ink-soft)}
.pv td{font-size:1.5rem;color:var(--deep)}
.pv td.dot{background:#f4f7f8;color:var(--coral)}
.pv td.hi{background:#fff2cf;color:#8a5c05}
/* 直式 */
.vert{font-family:"Courier New",monospace;font-size:1.6rem;line-height:1.7;text-align:right;
  display:inline-block;min-width:8em;padding:6px 14px}
.vert .ln{border-bottom:3px solid var(--deep);padding-bottom:3px}
.vert .op{float:left}
.vertwrap{text-align:center}

table.rec{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:.9rem;background:#fff}
table.rec th,table.rec td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;line-height:2.0}
table.rec th{background:#e7eef1;font-weight:normal}
table.rec td.n{text-align:center;white-space:nowrap}
.iep{width:100%;min-height:240px;font-family:"標楷體","DFKai-SB",monospace;font-size:.9rem;
  line-height:1.85;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.note{border-left:5px solid var(--gold);background:#fff;border-radius:0 14px 14px 0;
  padding:11px 18px;font-size:.86rem;line-height:2.15;margin-top:16px}

@media (max-width:420px){
  body{font-size:18px}
  .hero h1{font-size:1.42rem}
  .qtext{font-size:1.1rem}
  .opt{font-size:1.06rem}
  .pv td{font-size:1.25rem}
  .vert{font-size:1.35rem}
}
@media print{ body{background:#fff} .noprint{display:none!important} .wrap{padding:0;max-width:100%} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== 可愛教學版 ===== */
:root{--ink:#39424e;--ink-soft:#687386;--paper:#fff8ee;--card:#fffdf9;--line:#eadfce;--deep:#6d96b9;--gold:#f4c86a;--coral:#ef8f8f;--sky:#86c8d8;--plum:#aa91c8;--ok:#72b89b}
body{background:radial-gradient(circle at 8% 8%,#ffe8dc 0 70px,transparent 72px),radial-gradient(circle at 92% 16%,#e5f5e5 0 90px,transparent 92px),linear-gradient(180deg,#fffaf2,#f6fbff);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:880px}.topbar{background:#ffffffd9;padding:8px 12px;border:2px solid #f0e6d8;border-radius:18px;box-shadow:0 6px 18px #50463c0f}.brand{font-weight:800}
.hero{background:linear-gradient(135deg,#7aa5c8,#92cfd6);border:4px solid #fff;border-radius:30px;box-shadow:0 12px 28px #50789629}.hero:before{content:"✦";position:absolute;right:28px;top:8px;font-size:3rem;color:#ffffff80}.hero h1{font-weight:900}.hero p{color:#f8ffff;font-weight:700}
.unit{border:0;background:#fff3cf;display:inline-block;padding:5px 14px;border-radius:999px;color:#78633d;font-weight:900;margin-top:24px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ch{border-color:#eee3d4;border-radius:24px;box-shadow:0 7px 0 #eee3d4;transition:.16s}.ch:before{content:"📘";font-size:1.25rem;margin-right:8px}.ch:nth-child(2n):before{content:"🌱"}.ch:hover{transform:translateY(-3px);border-color:#f0c57a}.ch.done:before{content:"⭐"}.ch.done{box-shadow:0 7px 0 #cfe9da}.ch .nm{display:inline;font-weight:900}.ch .meta{margin-left:2rem}
.card{border-color:#eee2d2;border-radius:28px;box-shadow:0 10px 24px #4a484311;padding:22px}.say{background:#fff7df;border-color:#eab85c;border-radius:20px}.keypoint{background:#eef9fb;border-color:#9ed3dd;border-radius:18px;box-shadow:inset 5px 0 0 #86c8d8}.keypoint b:before{content:"💡 "}.stage{border-radius:20px;background:#fffdf9;border-color:#eadfce}.qtext{font-weight:900;color:#4f6781}
.opts{grid-template-columns:repeat(2,minmax(0,1fr))}.opt{border-color:#eadfce;border-radius:20px;background:#fffefa;box-shadow:0 5px 0 #eee3d4;transition:.15s}.opt:hover{transform:translateY(-2px);border-color:#a8cfdd}.feedback.good:before{content:"🌟 "}.feedback.bad:before{content:"🌱 "}
.btn{border-radius:20px;background:linear-gradient(135deg,#668fb4,#79b5c5);box-shadow:0 6px 0 #527792;font-weight:900;transition:.15s}.btn:hover{transform:translateY(-2px)}.btn.gold{background:linear-gradient(135deg,#ffd879,#f1bd58);box-shadow:0 6px 0 #d8a84c}.btn.hint{background:linear-gradient(135deg,#8ccedb,#77b7cc);box-shadow:0 6px 0 #5f9db1}.btn.ghost{background:#fff;color:#62809d;border-color:#a9c8dc;box-shadow:none}
.note{border:2px dashed #e6bd72;border-left:2px dashed #e6bd72;border-radius:18px;background:#fff9e8}
@media(max-width:620px){.grid,.opts{grid-template-columns:1fr}.wrap{padding:12px 12px 48px}.card{padding:18px 14px}}

/* ===== 完全教學版元件 ===== */
.lesson-road{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0 18px
}
.road-step{
  background:#fff;border:2px solid #eadfce;border-radius:18px;padding:9px 6px;
  text-align:center;font-size:.78rem;line-height:1.65;font-weight:800;color:#687386
}
.road-step.on{background:#fff3cf;border-color:#f0c46b;color:#725b2f;transform:translateY(-2px)}
.road-step.done{background:#e9f7ef;border-color:#9fd2b8;color:#477b63}
.teach-title{
  font-size:1.28rem;font-weight:900;color:#4f6781;margin:4px 0 12px;
  display:flex;align-items:center;gap:8px
}
.teach-box{
  border-radius:22px;padding:16px 18px;margin:12px 0;border:3px solid #eadfce;background:#fffefa
}
.teach-box.what{background:#fff7df;border-color:#efd28d}
.teach-box.look{background:#eef9fb;border-color:#a8d8df}
.teach-box.sayit{background:#f4effc;border-color:#c8b6df}
.teach-box.try{background:#eef8f1;border-color:#add7bf}
.teach-label{font-size:.82rem;font-weight:900;color:#687386;margin-bottom:5px}
.big-rule{font-size:1.2rem;font-weight:900;line-height:2;color:#4d657c}
.teacher-line{
  margin-top:10px;padding:10px 14px;border-radius:16px;background:#fff;
  border:2px dashed #d8c9b6;color:#596675;font-size:.94rem
}
.teacher-line:before{content:"👩‍🏫 老師可以說：";font-weight:900}
.mini-check{
  padding:13px 15px;border-radius:18px;background:#fff8e9;border:2px solid #efcf8c;
  margin-top:12px;font-weight:800
}
.celebrate{text-align:center;font-size:1.15rem;font-weight:900;padding:18px;background:#eef8f1;border-radius:22px;border:3px solid #add7bf}
@media(max-width:620px){
  .lesson-road{grid-template-columns:1fr 1fr}
  .road-step:last-child{grid-column:1/-1}
}


/* ===== 直式除法練習 ===== */
.ld-hero{background:var(--deep);color:#fff;border-radius:22px;padding:16px 20px;margin-bottom:12px}
.ld-hero h2{margin:0 0 4px;font-size:1.3rem;line-height:2}
.ld-hero p{margin:0;font-size:.88rem;line-height:2.1;color:#cbe1e8}
.ld-hero .rb>.rt{color:#9cc2d0}
.longdiv{width:320px;max-width:100%;margin:14px auto 16px;display:grid;
  grid-template-columns:86px 1fr;grid-template-rows:60px 66px 60px 60px;position:relative}
.longdiv:before{content:"";position:absolute;left:86px;right:0;top:60px;border-top:4px solid var(--deep)}
.longdiv:after{content:"";position:absolute;left:82px;top:60px;height:66px;border-left:4px solid var(--deep);border-radius:18px 0 0 0}
.ldcell{display:flex;align-items:center;justify-content:center;position:relative}
.ldlabel{position:absolute;top:0;left:3px;font-size:.7rem;line-height:1.7;color:var(--ink-soft)}
.ldnum{font-size:1.6rem;color:var(--deep)}
.ldin{width:88px;text-align:center;font-family:inherit;font-size:1.4rem;border:3px solid var(--line);
  border-radius:12px;padding:6px;background:#f7fbfc;color:var(--ink)}
.ldin:focus{outline:4px solid var(--gold)}
.ldin.good{border-color:var(--ok);background:#eaf6f0}
.ldin.bad{border-color:var(--coral);background:#fdeeeb}
.ld-q{grid-column:2;grid-row:1}.ld-d{grid-column:1;grid-row:2}.ld-a{grid-column:2;grid-row:2}
.ld-p{grid-column:2;grid-row:3;border-bottom:3px solid var(--deep)}.ld-r{grid-column:2;grid-row:4}
.ldminus{position:absolute;left:6px;font-size:1.4rem;color:var(--deep)}
.ld-steps{display:grid;gap:7px;margin:10px 0}
.ld-step{background:#f4f8fa;border:2px solid var(--line);border-radius:13px;padding:7px 14px;
  font-size:.95rem;line-height:2.1;color:var(--ink-soft)}
.ld-step.on{background:#fff6e2;border-color:var(--gold);color:var(--ink)}
.ld-actions{display:flex;gap:9px;flex-wrap:wrap}
.ld-actions .btn{flex:1;min-width:150px;margin-top:0}

/* ===== 多互動案例擴充 ===== */
.case-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.case-tab{border:2px solid #d9dfe4;background:#fff;border-radius:999px;padding:8px 14px;
 font:inherit;font-size:.84rem;font-weight:900;color:#647384;cursor:pointer}
.case-tab.on{background:#fff3cf;border-color:#efc66e;color:#725b2f}
.interact-board{background:#fff;border:3px solid #eadfce;border-radius:22px;padding:16px;margin:12px 0}
.tap-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.tap-chip{min-width:58px;min-height:52px;border:3px solid #d9e3e8;background:#fff;border-radius:16px;
 font:inherit;font-size:1.12rem;font-weight:900;color:#4f6781;cursor:pointer}
.tap-chip.sel{background:#fff0bd;border-color:#e9b94e}
.tap-chip.good{background:#e7f7ee;border-color:#72b89b}
.tap-chip.bad{background:#fdeceb;border-color:#ef8f8f}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

 font:inherit;font-weight:900;cursor:pointer;min-height:54px}

.number-line-simple{position:relative;height:78px;margin:18px 12px 4px}

.nl-dot{position:absolute;top:22px;width:30px;height:30px;border-radius:50%;border:3px solid #fff;
 box-shadow:0 0 0 2px #7893a7;background:#f4c86a;transform:translateX(-50%);cursor:pointer}
.nl-label{position:absolute;top:55px;transform:translateX(-50%);font-weight:900;font-size:.85rem}

.group-area{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.case-feedback{min-height:44px;margin-top:10px;padding:9px 12px;border-radius:15px;background:#f7f4ef;font-weight:800}
.case-feedback.ok{background:#e9f7ef;color:#477b63}.case-feedback.no{background:#fff0ed;color:#9b5d55}
@media(max-width:620px){.match-grid{grid-template-columns:1fr}.demo-number{font-size:1.65rem}}

</style>

function zhuBox(z){
  let base=z,tone='';
  const last=z[z.length-1];
  if(last==='\u02CA'||last==='\u02C7'||last==='\u02CB'){ tone=last; base=z.slice(0,-1); }
  return '<span class="rt"><span class="zs">'+base+'</span>'+(tone?'<span class="tn">'+tone+'</span>':'')+'</span>';
}
function ruby(str){
  let out='',i=0;
  while(i<str.length){
    const ch=str[i];
    if(ch==='<'){
      if(str.substr(i,4)==='<svg'){ const e=str.indexOf('</svg>',i);
        if(e>=0){ out+=str.slice(i,e+6); i=e+6; continue; } }
      const j=str.indexOf('>',i); if(j<0){ out+=str.slice(i); break; }
      out+=str.slice(i,j+1); i=j+1; continue;
    }
    if(/[\u4e00-\u9fff]/.test(ch)){
      const z=ZH[ch];
      out += z?'<span class="rb">'+ch+zhuBox(z)+'</span>':'<span class="rb miss">'+ch+'</span>';
      i++; continue;
    }
    out+=ch; i++;
  }
  return out;
}
function T(s){ return ruby(s); }          /* 指導語／題幹：加注音 */

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[R(0,a.length-1)];
function shuffle(a){ const b=a.slice();
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function mc(correct,wrongs,fmt){
  fmt=fmt||(v=>String(v));
  const seen=new Set([fmt(correct)]),chosen=[];
  for(const w of shuffle(wrongs)){
    if(typeof w==='number'&&(!isFinite(w))) continue;
    if(typeof w==='string'&&w.trim().charAt(0)==='-') continue;
    const k=fmt(w); if(seen.has(k)) continue;
    seen.add(k); chosen.push(w); if(chosen.length===3) break;
  }
  /* 干擾選項可能互相重複而不足三個，用鄰近數補滿，避免出現三選項的題目 */
  let step=1;
  while(chosen.length<3 && typeof correct==='number' && step<80){
    for(const c of [correct+step, correct-step]){
      if(chosen.length===3) break;
      if(!(c>0) || seen.has(fmt(c))) continue;
      seen.add(fmt(c)); chosen.push(c);
    }
    step++;
  }
  const all=shuffle([correct].concat(chosen));
  return {opts:all.map(fmt),ans:all.indexOf(correct)};
}
function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function factorsOf(n){ const f=[]; for(let i=1;i<=n;i++) if(n%i===0) f.push(i); return f; }
function groupsSVG(total,per){
  const full=Math.floor(total/per), rest=total%per, s=20,pad=8;
  const perRow=Math.min(per,8), rows=Math.ceil(per/perRow);
  const gw=perRow*s+pad*2, gh=rows*s+pad*2;
  const boxes=full+(rest?1:0), cols=Math.min(4,Math.max(1,boxes));
  const W=cols*(gw+9)+9, lines=Math.ceil(boxes/cols), H=lines*(gh+9)+9;
  let g='';
  for(let b=0;b<boxes;b++){
    const cx=9+(b%cols)*(gw+9), cy=9+Math.floor(b/cols)*(gh+9), isR=(b===full);
    g+='<rect x="'+cx+'" y="'+cy+'" width="'+gw+'" height="'+gh+'" rx="7" fill="'+
       (isR?'#fdeeeb':'#e9f2f6')+'" stroke="'+(isR?'#cf5b41':'#3d8ba6')+'" stroke-width="2"/>';
    const cnt=isR?rest:per;
    for(let i=0;i<cnt;i++){
      const r=Math.floor(i/perRow),c=i%perRow;
      g+='<rect x="'+(cx+pad+c*s+2)+'" y="'+(cy+pad+r*s+2)+'" width="'+(s-5)+'" height="'+(s-5)+
         '" rx="3" fill="'+(isR?'#cf5b41':'#1f5d70')+'"/>';
    }
  }
  return '<svg viewBox="0 0 '+W+' '+H+'">'+g+'</svg>';
}
/* ---- 因數配對表 ---- */
function pairTable(n,now,max){
  let h='<table class="pv"><tr><th>試</th><th>配對</th><th>因數</th></tr>';
  for(let i=1;i<=max;i++){
    const ok=(n%i===0);
    if(i>now) h+='<tr><td style="font-size:1rem;color:#b8c4ca">'+i+'</td><td style="font-size:1rem;color:#b8c4ca">?</td><td style="font-size:1rem;color:#b8c4ca">?</td></tr>';
    else if(ok) h+='<tr><td style="font-size:1rem">'+i+'</td><td style="font-size:1rem">'+i+' × '+(n/i)+'</td><td style="font-size:1rem;color:#2d7a59">○</td></tr>';
    else h+='<tr><td style="font-size:1rem">'+i+'</td><td style="font-size:1rem">—</td><td style="font-size:1rem;color:#cf5b41">×</td></tr>';
  }
  return h+'</table>';
}

/* ==================================================================
   3. 題目產生器
   每題回傳 {art, prompt, mc, hint, steps[]}
   steps 同時供「提示」與「示範」使用，不另外寫兩套
   ================================================================== */
const GEN = {
/* --- 2-1 認識倍數（判別法、奇偶、找倍數） --- */
'2-1'(){
  const type=R(1,5);
  if(type===1){                                   /* 2、5、10 的判別法 */
    const d=P([2,5,10]);
    const k=R(2,9), cor=d*k;
    const bads=[]; for(let i=0;i<12;i++){ const v=cor+R(1,9); if(v%d!==0) bads.push(v); }
    return {art:null, prompt:'下面哪一個是 '+d+' 的倍數？',
      hint:(d===2?'個位是 0、2、4、6、8。':d===5?'個位是 0 或 5。':'個位是 0。'),
      steps:[d+' 的倍數只要看個位。',
             (d===2?'個位是 0、2、4、6、8 就是 2 的倍數。':d===5?'個位是 0 或 5 就是 5 的倍數。':'個位是 0 就是 10 的倍數。'),
             cor+' 的個位是 '+(cor%10)+'，所以是 '+d+' 的倍數。'],
      mc:mc(cor,bads)};
  }
  if(type===2){                                   /* 奇數與偶數 */
    const n=R(11,99), even=(n%2===0);
    return {art:null, prompt:n+' 是奇數還是偶數？',
      hint:'個位可以被 2 整除就是偶數。',
      steps:[n+' 的個位是 '+(n%10)+'。',
             (even?'個位可以被 2 整除。':'個位不能被 2 整除。'),
             '所以 '+n+' 是'+(even?'偶數':'奇數')+'。'],
      mc:{opts:shuffle(['奇數','偶數','兩個都是','都不是']),ans:-1,cor:(even?'偶數':'奇數')}};
  }
  if(type===3){                                   /* 找第幾個倍數 */
    const d=P([3,4,6,7,8,9]), k=R(2,9);
    return {art:null, prompt:d+' 的第 '+k+' 個倍數是多少？',
      hint:d+' × '+k+' 就是答案。',
      steps:['第幾個倍數，就是乘幾。', d+' × '+k+' = '+(d*k)+'。'],
      mc:mc(d*k,[d*k+d,d*k-d,d+k,d*k+1])};
  }
  if(type===4){                                   /* 判別法的規則本身 */
    const d=P([2,5,10]);
    const cor=(d===2?'個位是 0、2、4、6、8':d===5?'個位是 0 或 5':'個位是 0');
    return {art:null, prompt:d+' 的倍數，個位數字會是什麼？',
      hint:'回想剛才找到的那些倍數，它們的個位有什麼一樣的地方。',
      steps:['把 '+d+' 的倍數寫幾個出來。','看它們的個位。','會發現：'+cor+'。'],
      mc:{opts:shuffle(['個位是 0、2、4、6、8','個位是 0 或 5','個位是 0','個位是 1 或 3']),
          ans:-1,cor:cor}};
  }
  /* 3、9 的檢查方法：各位數字和 */
  const d=P([3,9]);
  const n=d*R(12,40);
  const ds=String(n).split('').map(Number), sum=ds.reduce((a,b)=>a+b,0);
  return {art:null, prompt:'要看 '+n+' 是不是 '+d+' 的倍數，應該怎麼做？',
    hint:'把每一個數字加起來看看。',
    steps:['把各位數字加起來：'+ds.join(' + ')+' = '+sum+'。',
           sum+' 是 '+d+' 的倍數。','所以 '+n+' 也是 '+d+' 的倍數。'],
    mc:{opts:shuffle(['把各位數字加起來，看是不是 '+d+' 的倍數',
                      '看個位是不是 '+d,
                      '看有沒有出現 '+d+' 這個數字',
                      '看十位是不是 '+d]),
        ans:-1,cor:'把各位數字加起來，看是不是 '+d+' 的倍數'}};
},
/* --- 2-2 認識因數（含整除、成對找因數） --- */
'2-2'(){
  const n=P([12,16,18,20,24,28,30,36]), fs=factorsOf(n);
  const type=R(1,5);
  if(type===4){                                   /* 整除：分完有沒有剩 */
    const b=R(3,9), q=R(4,12), extra=(R(1,2)===1?0:R(1,b-1));
    const a=b*q+extra, yes=(extra===0);
    return {art:groupsSVG(a,b), prompt:a+' ÷ '+b+' 可以整除嗎？',
      hint:'分完有沒有剩下？沒有剩下就是整除。',
      steps:[a+' 個每 '+b+' 個一堆。',
             (yes?'剛好分完，沒有剩下。':'剩下 '+extra+' 個。'),
             (yes?'所以可以整除。':'所以不能整除。')],
      mc:{opts:shuffle(['可以整除','不能整除','有時候可以','不一定']),ans:-1,
          cor:(yes?'可以整除':'不能整除')}};
  }
  if(type===5){                                   /* 利用乘法找成對的因數 */
    const pairs=[]; fs.forEach(x=>{ if(x*x<=n && x<n) pairs.push([x,n/x]); });
    const pr=P(pairs);
    return {art:pairTable(n,Math.min(n,8),Math.min(n,8)),
      prompt:pr[0]+' × 幾 = '+n+'？這一對都是 '+n+' 的因數。',
      hint:'用乘法想：'+pr[0]+' 乘多少會得到 '+n+'。',
      steps:['因數是成對出現的。', pr[0]+' × '+pr[1]+' = '+n+'。',
             '所以 '+pr[0]+' 和 '+pr[1]+' 都是 '+n+' 的因數。'],
      mc:mc(pr[1],[pr[1]+1,pr[1]-1,pr[0],n-pr[0],pr[1]+2])};
  }
  if(type===1){
    const a=P(fs.filter(x=>x>1&&x<n));
    const bads=[]; for(let i=2;i<=12;i++) if(n%i!==0) bads.push(i);
    return {art:pairTable(n,Math.min(n,8),Math.min(n,8)),
      prompt:'下面哪一個是 '+n+' 的因數？',
      hint:'能整除 '+n+' 的數才是因數。',
      steps:['一個一個試，看能不能整除 '+n+'。','能整除、沒有餘數的就是因數。','答案是 '+a+'。'],
      mc:mc(a, shuffle(bads).slice(0,6))};
  }
  if(type===2){
    return {art:pairTable(n,Math.min(n,8),Math.min(n,8)),
      prompt:n+' 一共有幾個因數？',
      hint:'1 和 '+n+' 自己也要算進去。',
      steps:['從 1 開始一個一個試。','因數會成對出現。',n+' 的因數是 '+fs.join('、')+'，共 '+fs.length+' 個。'],
      mc:mc(fs.length,[fs.length+1,fs.length-1,fs.length+2,fs.length*2])};
  }
  const b=P([5,7,8,9,11].filter(x=>n%x!==0).concat(fs.filter(x=>x>1&&x<n)));
  const isF=(n%b===0);
  return {art:groupsSVG(n,b), prompt:b+' 是 '+n+' 的因數嗎？',
    hint:n+' ÷ '+b+' 有沒有餘數？',
    steps:[n+' 個每 '+b+' 個一堆。',(isF?'剛好分完。':'有剩下。'),(isF?'所以是因數。':'所以不是因數。')],
    mc:{opts:shuffle(['是','不是','有時候是','不一定']),ans:-1,cor:(isF?'是':'不是')}};
}
,
/* --- 2-3 倍數與因數的關係和應用 --- */
'2-3'(){
  const type=R(1,4);
  if(type===1){                                   /* 同一個算式的兩種說法 */
    const a=P([3,4,5,6]), b=P([3,4,5,6]), N=a*b;
    const cor=a+' 是 '+N+' 的因數';
    return {art:groupsSVG(N,a), prompt:a+' × '+b+' = '+N+'，哪一句是對的？',
      hint:'小的是因數，大的是倍數。',
      steps:[a+' 可以把 '+N+' 剛好分完。','所以 '+a+' 是 '+N+' 的因數。',
             '反過來說，'+N+' 是 '+a+' 的倍數。'],
      mc:{opts:shuffle([cor, N+' 是 '+a+' 的因數', a+' 是 '+N+' 的倍數', a+' 是 '+b+' 的因數']),
          ans:-1,cor:cor}};
  }
  if(type===2){                                   /* 倍數之間的關係 */
    const set=P([[6,'2 和 3'],[10,'2 和 5'],[15,'3 和 5'],[12,'3 和 4'],[14,'2 和 7']]);
    const wrong=['4 和 5','5 和 7','7 和 8','8 和 9','2 和 9','3 和 7'].filter(x=>x!==set[1]);
    return {art:null, prompt:set[0]+' 的倍數，一定也是誰的倍數？',
      hint:'先把 '+set[0]+' 拆成兩個數相乘。',
      steps:[set[0]+' 可以拆成 '+set[1].replace(' 和 ',' × ')+'。',
             '所以 '+set[0]+' 的倍數，一定同時是這兩個數的倍數。'],
      mc:{opts:shuffle([set[1]].concat(shuffle(wrong).slice(0,3))),ans:-1,cor:set[1]}};
  }
  if(type===3){                                   /* 應用：繩長是尺長的倍數 */
    const unit=P([5,6,8,10,12]), times=R(3,8), total=unit*times;
    return {art:null, prompt:'一條繩子長 '+total+' 公分，用 '+unit+' 公分的尺去量，剛好量幾次？',
      hint:'看 '+total+' 裡面有幾個 '+unit+'。',
      steps:[total+' ÷ '+unit+' = '+times+'。','剛好量 '+times+' 次，沒有剩下。',
             '所以 '+total+' 是 '+unit+' 的倍數。'],
      mc:mc(times,[times+1,times-1,unit,total-unit,times+2], v=>v+' 次')};
  }
  /* 應用：班級人數是小組人數的倍數 */
  const per=P([3,4,5,6]), groups=R(4,8), total=per*groups;
  return {art:groupsSVG(total,per), prompt:'全班 '+total+' 人，每組 '+per+' 人，剛好分成幾組？',
    hint:total+' 裡面有幾個 '+per+'？',
    steps:[total+' ÷ '+per+' = '+groups+'。','沒有人落單。',
           '所以班級人數是小組人數的倍數。'],
    mc:mc(groups,[groups+1,groups-1,per,total-per,groups+2], v=>v+' 組')};
}
};

function lessonRoad(now){

  return '<div class="lesson-road">'+names.map((x,i)=>
    '<div class="road-step '+(i<now?'done':i===now?'on':'')+'">'+x+'</div>'
  ).join('')+'</div>';
}

function interactionPanel(chapterId){
  const cases=CASES[chapterId]||[];
  const wrap=el('div');
  const tabs=el('div','case-tabs');
  const board=el('div','interact-board');
  wrap.appendChild(tabs);wrap.appendChild(board);
  cases.forEach((c,i)=>{
    const b=el('button','case-tab'+(i===0?' on':''),T(c.name));
    b.type='button';
    b.addEventListener('click',()=>{
      tabs.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');drawCase(board,c);
    });
    tabs.appendChild(b);
  });
  if(cases[0]) drawCase(board,cases[0]);
  return wrap;
}
function fb(host,msg,ok){
  host.className='case-feedback '+(ok?'ok':'no');
  host.innerHTML=(ok?'🌟 ':'🌱 ')+T(msg);   /* 回饋也是指導語，要加注音 */
}
function drawCase(board,c){
  board.innerHTML='';
  board.appendChild(el('div','teach-title',T(c.title)));
  if(c.intro) board.appendChild(el('div','say',T(c.intro)));
  const feedback=el('div','case-feedback',T('動手試試看。'));
  if(c.type==='choice'){
    board.appendChild(el('div','say',T(c.prompt)));
    const row=el('div','tap-row');
    c.opts.forEach((o,i)=>{
      const b=el('button','tap-chip',N(o));b.type='button';
      b.onclick=()=>{
        row.querySelectorAll('button').forEach(x=>x.disabled=true);
        b.classList.add(i===c.ans?'good':'bad');
        if(i!==c.ans) row.children[c.ans].classList.add('good');
        fb(feedback,(i===c.ans?'答對了！':'一起看正確答案。')+' '+c.explain,i===c.ans);
      };row.appendChild(b);
    });board.appendChild(row);
  } else if(c.type==='groups'){
    const area=el('div','group-area');
    let left=c.total;
    while(left>0){
      const n=Math.min(c.per,left),g=el('div','group-box'+(n<c.per?' rest':''));
      for(let i=0;i<n;i++)g.appendChild(el('span','object-dot','●'));
      area.appendChild(g);left-=n;
    }
    board.appendChild(area);
    const row=el('div','tap-row');
    ['可以整除','不能整除'].forEach((txt,i)=>{
      const correct=(c.yes?0:1);
      const b=el('button','tap-chip',T(txt));b.type='button';
      b.onclick=()=>{
        row.querySelectorAll('button').forEach(x=>x.disabled=true);
        b.classList.add(i===correct?'good':'bad');
        if(i!==correct) row.children[correct].classList.add('good');
        fb(feedback,c.explain,i===correct);
      };row.appendChild(b);
    });board.appendChild(row);
  }
  board.appendChild(feedback);
}

function makeItem(){
  const c=CHAPTERS[S.ci];
  if(S.phase==='review'){
    const pool=c.review;
    return normalize(GEN[P(pool)]());
  }
  return normalize(GEN[c.teachKey]());
}
function nextItem(){
  const c=CHAPTERS[S.ci];
  if(S.phase==='review' && S.i>=S.nRev){ S.phase='teach'; return renderTeach(); }
  if(S.phase==='new' && S.i>=S.nNew){ return renderWrap(); }
  paintHUD();
  renderItem(makeItem());
}
/* 新概念說明：用一題示範帶出重點 */
function renderTeach(){
  const c=CHAPTERS[S.ci], host=document.getElementById('runCard');
  const q=normalize(GEN[c.teachKey]());
  let k=0;
  paintHUD();
  function draw(){
    host.innerHTML='';
    host.appendChild(el('div','qtext',T('🌼 今天一起學：'+c.title)));
    host.appendChild(el('div','keypoint','<b>'+T('今天的祕訣')+'　</b>'+T(c.key)));
    host.appendChild(el('div','say',T('先不用急著回答。跟著老師看一遍，看看每一步在做什麼。')));
    if(q.art) host.appendChild(el('div','stage',q.art));
    host.appendChild(el('div','say','<b>'+T('一起觀察')+'　</b>'+T(q.prompt)));
    for(let j=0;j<=k && j<q.steps.length;j++)
      host.appendChild(el('div','keypoint','<b>'+T('第'+'一二三四五'[j]+'步')+'　</b>'+T(q.steps[j])));
    const last=(k>=q.steps.length-1);
    if(last) host.appendChild(el('div','say','<b>'+T('重點')+'　</b>'+T(c.key)));
    const b=el('button','btn gold',T(last?'我懂方法了，來試試看':'看下一步'));
    b.addEventListener('click',()=>{
      if(last){ S.phase='new'; S.i=0; nextItem(); } else { k++; draw(); }
    });
    host.appendChild(b);
  }
  draw();
}
/* 出一題，依層級改變介面行為 */
function renderItem(q){
  const host=document.getElementById('runCard');
  host.innerHTML='';
  if(q.art) host.appendChild(el('div','stage',q.art));
  host.appendChild(el('div','qtext',T(q.prompt)));
  const hintHost=el('div'); host.appendChild(hintHost);
  let usedHint=false, tries=0, demoed=false;
  function showHint(){
    if(hintHost.firstChild) return;
    hintHost.appendChild(el('div','keypoint','<b>'+T('提示')+'　</b>'+T(q.hint)));
  }
  const box=el('div','opts'); host.appendChild(box);
  const btns=[];
  q.mc.opts.forEach((o,i)=>{
    const b=el('button','opt','<span class="tag">'+TAGS[i]+'</span><span>'+N(o)+'</span>');
    b.addEventListener('click',()=>pick(i,b));
    btns.push(b); box.appendChild(b);
  });
  const hintBtn=el('button','btn hint',T('給我一個小提示'));
  if(S.lv<=1){                                   /* 獨立層沒有提示鈕 */
    hintBtn.addEventListener('click',()=>{ usedHint=true; showHint(); hintBtn.remove(); });
    host.appendChild(hintBtn);
  }

  function pick(idx,btn){
    const ok=(idx===q.mc.ans);
    if(ok){
      btns.forEach(b=>b.disabled=true);
      btn.classList.add('right');
      const kind = demoed?'demo':(usedHint||tries>0?'hint':'ind');
      finishItem(kind, host, q, true);
      return;
    }
    btn.classList.add('wrong'); btn.disabled=true; tries++;
    if(S.lv===0 && !demoed){                     /* 示範層：帶做一次再重答 */
      demoed=true;
      const d=el('div','shift','<b>'+T('沒關係，我們一起做一次')+'</b><br>'+
        q.steps.map((s,j)=>T('第'+'一二三四五'[j]+'步　'+s)).join('<br>'));
      host.appendChild(d);
      btns.forEach(b=>{ b.disabled=false; b.classList.remove('wrong'); });
      d.scrollIntoView({block:'nearest'});
      return;
    }
    if(S.lv===1 && tries===1){                   /* 提示層：給一次補救 */
      showHint();
      const f=el('div','feedback bad',T('差一點點，我們看提示再試一次。'));
      host.appendChild(f); setTimeout(()=>f.remove(),2000);
      return;
    }
    btns.forEach(b=>b.disabled=true);
    if(q.mc.ans>=0) btns[q.mc.ans].classList.add('right');
    finishItem('fail', host, q, false);
  }
}
function finishItem(kind, host, q, ok){
  S.res[kind]++;
  if(kind==='ind'){ S.consecPass++; } else { S.consecPass=0; }
  if(kind==='fail'){ S.consecFail++; } else { S.consecFail=0; }

  host.appendChild(el('div','feedback '+(ok?'good':'bad'),
    T(ok?(kind==='ind'?'答對了！':'這樣就對了。')
        :('正確答案是 '+q.mc.opts[q.mc.ans]+'。'))));
  if(!ok) host.appendChild(el('div','keypoint',
    q.steps.map((s,j)=>T('第'+'一二三四五'[j]+'步　'+s)).join('<br>')));

  /* 退階／晉階 */
  let shifted=null;
  if(CFG.auto){
    if(S.consecFail>=2 && S.lv>0){ S.lv--; shifted='down'; S.consecFail=0; }
    else if(S.consecPass>=3 && S.lv<2){ S.lv++; shifted='up'; S.consecPass=0; }
  }
  if(shifted){
    S.shifts.push({at:(S.phase==='review'?'複習':'新概念')+' 第'+(S.i+1)+'題',
                   dir:shifted, to:LV[S.lv].name});
    host.appendChild(el('div','shift',
      T(shifted==='down'?'我們先放慢一點，老師帶你做。':'你可以自己做了，提示先收起來。')));
  }
  const b=el('button','btn',T('下一題'));
  b.addEventListener('click',()=>{ S.i++; nextItem(); });
  host.appendChild(b); b.scrollIntoView({block:'nearest'});
}
function renderWrap(){
  const c=CHAPTERS[S.ci], host=document.getElementById('runCard');
  LOG[c.id]={ id:c.id, title:c.title, unit:c.unit, res:Object.assign({},S.res),
    startLv:S.startLv, endLv:S.lv, shifts:S.shifts.slice() };
  host.innerHTML='';
  host.appendChild(el('div','qtext',T('【'+c.id+'】'+c.title+'　做完了')));
  host.appendChild(el('div','say','<b>'+T('重點')+'　</b>'+T(c.key)));
  const r=S.res, tot=r.ind+r.hint+r.demo+r.fail;
  host.appendChild(el('div','keypoint',
    T('獨立 '+r.ind+'　提示 '+r.hint+'　示範 '+r.demo+'　未達成 '+r.fail+'　共 '+tot+' 題')));
  const nx=el('button','btn gold',T(S.ci<CHAPTERS.length-1?'上下一章':'看紀錄'));
  nx.addEventListener('click',()=>{ if(S.ci<CHAPTERS.length-1) startChapter(S.ci+1); else openRecord(); });
  host.appendChild(nx);
  const again=el('button','btn',T('再做一次這一章'));
  again.addEventListener('click',()=>startChapter(S.ci)); host.appendChild(again);
  const home=el('button','btn ghost',T('回首頁'));
  home.addEventListener('click',()=>{ paintMenu(); show('scHome'); }); host.appendChild(home);
}

   學生自己填「商、乘積、餘數」，再判斷能不能整除。
   作答併入同一份 LOG，不另開紀錄。

const LD_FIXED=[[24,6],[18,3],[20,4],[17,5],[30,5],[36,6],[42,7],[35,6],[56,8],[72,9]];
let LD=null;

/* 產生新的一組：八題整除、兩題有餘數，打散後出題 */
function ldNewSet(){
  const out=[];
  while(out.length<8){
    const b=R(2,9), q=R(2,9), a=b*q;
    if(a<=99 && !out.some(x=>x[0]===a&&x[1]===b)) out.push([a,b]);
  }
  while(out.length<10){
    const b=R(3,9), q=R(2,9), r=R(1,b-1), a=b*q+r;
    if(a<=99 && !out.some(x=>x[0]===a&&x[1]===b)) out.push([a,b]);
  }
  return shuffle(out);
}
function startDrill(fresh){
  LD={ set: fresh?ldNewSet():LD_FIXED.slice(), i:0,
       res:{ind:0,hint:0,demo:0,fail:0}, detail:[], hintsUsed:0 };
  show('scDrill');
  ldRender();
}
function ldRender(){
  const [a,b]=LD.set[LD.i];
  const q=Math.floor(a/b), pr=q*b, r=a%b;
  const host=document.getElementById('ldCard');
  document.getElementById('ldTag').innerHTML=T('自己填');
  document.getElementById('ldWhere').innerHTML=T('直式練習　第 '+(LD.i+1)+'/'+LD.set.length+' 題');
  document.getElementById('ldBar').style.width=(LD.i/LD.set.length*100)+'%';

  host.innerHTML=
    '<div class="qtext" style="text-align:center">'+a+' ÷ '+b+'　'+T('請自己完成直式')+'</div>'+
    '<div class="longdiv">'+
      '<div class="ldcell ld-q"><span class="ldlabel">'+T('①商')+'</span>'+
        '<input class="ldin" id="ldq" inputmode="numeric" aria-label="商"></div>'+
      '<div class="ldcell ld-d"><span class="ldlabel">'+T('除數')+'</span><span class="ldnum">'+b+'</span></div>'+
      '<div class="ldcell ld-a"><span class="ldlabel">'+T('被除數')+'</span><span class="ldnum">'+a+'</span></div>'+
      '<div class="ldcell ld-p"><span class="ldlabel">'+T('②乘回去')+'</span><span class="ldminus">−</span>'+
        '<input class="ldin" id="ldp" inputmode="numeric" aria-label="乘積"></div>'+
      '<div class="ldcell ld-r"><span class="ldlabel">'+T('③餘數')+'</span>'+
        '<input class="ldin" id="ldr" inputmode="numeric" aria-label="餘數"></div>'+
    '</div>'+
    '<div class="ld-steps" id="ldsteps">'+
      '<div class="ld-step on">'+T('① 想：'+b+' × 幾 最接近但不超過 '+a+'？')+'</div>'+
      '<div class="ld-step">'+T('② 把商乘回去，填在減號那一列。')+'</div>'+
      '<div class="ld-step">'+T('③ 用 '+a+' 減掉它，剩下的就是餘數。')+'</div>'+
    '</div>';
  const acts=el('div','ld-actions');
  const hintBtn=el('button','btn hint',T('給我一步提示'));
  const checkBtn=el('button','btn',T('檢查直式'));
  acts.appendChild(hintBtn); acts.appendChild(checkBtn); host.appendChild(acts);
  const fbBox=el('div','feedback',T('三個格子都由你自己填。'));
  host.appendChild(fbBox);

  let hints=0, tries=0;
  const steps=host.querySelectorAll('.ld-step');
  hintBtn.onclick=()=>{
    if(hints>=3) return;
    steps.forEach(x=>x.classList.remove('on'));
    steps[Math.min(hints,2)].classList.add('on');
    const msg=[ '先找 '+b+' 的倍數裡，最接近但不超過 '+a+' 的那一個。',
                b+' × '+q+' = '+pr+'，把 '+pr+' 填在乘回去那一格。',
                a+' − '+pr+' = '+r+'，這就是餘數。' ][hints];
    fbBox.className='feedback'; fbBox.innerHTML='💡 '+T(msg);
    hints++; LD.hintsUsed++;
    if(hints>=3){ hintBtn.disabled=true; }
  };
  checkBtn.onclick=()=>{
    const eq=document.getElementById('ldq'), ep=document.getElementById('ldp'), er=document.getElementById('ldr');
    if([eq,ep,er].some(e=>!/^\d+$/.test(e.value.trim()))){
      fbBox.className='feedback bad';
      fbBox.innerHTML='🌱 '+T('請在商、乘積、餘數三個格子填入完整的非負整數。');
      return;
    }
    const vq=Number(eq.value), vp=Number(ep.value), vr=Number(er.value);
    const okq=(vq===q), okp=(vp===pr), okr=(vr===r);
    [[eq,okq],[ep,okp],[er,okr]].forEach(([e,ok])=>{
      e.classList.remove('good','bad'); e.classList.add(ok?'good':'bad');
    });
    if(!(okq&&okp&&okr)){
      tries++;
      const parts=[];
      if(!okq) parts.push('商再想一次');
      if(!okp) parts.push('檢查除數乘商');
      if(!okr) parts.push('最後再相減');
      fbBox.className='feedback bad';
      fbBox.innerHTML='🌱 '+T(parts.join('、')+'。紅色的格子可以直接改，改完再檢查。');
      return;
    }
    /* 直式正確 → 記錄 → 進入整除判斷 */
    const clean=(tries===0 && hints===0);
    LD.res[clean?'ind':'hint']++;
    [eq,ep,er].forEach(e=>e.disabled=true);
    checkBtn.disabled=true; hintBtn.disabled=true;
    fbBox.className='feedback good';
    fbBox.innerHTML='🌟 '+T('直式完成！')+' '+a+' ÷ '+b+' = '+q+(r?' … '+r:'')+
      '<br>'+T('現在請判斷：'+a+' 可以被 '+b+' 整除嗎？');
    const judge=el('div','opts');
    const want=(r===0)?'可以整除':'不能整除';
    shuffle(['可以整除','不能整除']).forEach((txt,k)=>{
      const jb=el('button','opt','<span class="tag">'+TAGS[k]+'</span><span>'+T(txt)+'</span>');
      jb.onclick=()=>{
        judge.querySelectorAll('button').forEach(z=>z.disabled=true);
        const good=(txt===want);
        jb.classList.add(good?'right':'wrong');
        if(!good) Array.from(judge.children).forEach(z=>{
          if(z.textContent.indexOf(want)>=0) z.classList.add('right'); });
        LD.res[good?'ind':'fail']++;
        LD.detail.push({q:a+' ÷ '+b, r:r, clean:clean, judge:good, hints:hints, tries:tries});
        host.appendChild(el('div','feedback '+(good?'good':'bad'),
          (good?'🌟 ':'🌱 ')+T(r===0?('餘數是 0，所以 '+a+' 可以被 '+b+' 整除。')
                                   :('餘數是 '+r+'，所以 '+a+' 不能被 '+b+' 整除。'))));
        const nx=el('button','btn gold',T(LD.i===LD.set.length-1?'完成這一組':'下一題'));
        nx.onclick=()=>{ LD.i++; if(LD.i>=LD.set.length) ldFinish(); else ldRender(); };
        host.appendChild(nx); nx.scrollIntoView({block:'nearest'});
      };
      judge.appendChild(jb);
    });
    host.appendChild(judge);
  };
  const eq=document.getElementById('ldq');
  if(eq) eq.focus();
}
function ldFinish(){
  document.getElementById('ldBar').style.width='100%';
  const host=document.getElementById('ldCard');
  const n=LD.set.length;
  const cleanN=LD.detail.filter(d=>d.clean).length;
  const judgeN=LD.detail.filter(d=>d.judge).length;
  /* 併入同一份紀錄，IEP 只會有一份 */
  LOG['2-2直式']={ id:'2-2直式', title:'整除直式練習', unit:'倍數與因數', mode:'drill',
    res:Object.assign({},LD.res), startLv:1, endLv:(cleanN>=n*0.8?2:1), shifts:[],
    detail:LD.detail.slice(), hintsUsed:LD.hintsUsed, nQ:n };
  host.innerHTML=
    '<div class="qtext" style="text-align:center">🎉 '+T(n+' 題都做完了')+'</div>'+
    '<div class="keypoint">'+T('直式一次就填對 '+cleanN+' / '+n+' 題　整除判斷答對 '+judgeN+' / '+n+' 題')+'</div>'+
    '<div class="say">'+T('做完直式，看最後的餘數：餘數是 0 就可以整除，有餘數就不能整除。')+'</div>';
  const rev=el('div','ld-steps');
  rev.innerHTML=LD.detail.map((d,i)=>
    '<div class="ld-step">'+(d.clean?'✅':'🔁')+' '+T('第 '+(i+1)+' 題')+'　'+d.q+
    '　'+T('餘數')+' '+d.r+(d.judge?'':'　'+T('（判斷要再看一次）'))+'</div>').join('');
  host.appendChild(rev);
  const again=el('button','btn gold',T('換一組新題目'));
  again.onclick=()=>startDrill(true); host.appendChild(again);
  const rec=el('button','btn',T('看紀錄'));
  rec.onclick=openRecord; host.appendChild(rec);
  const home=el('button','btn ghost',T('回首頁'));
  home.onclick=()=>{ paintMenu(); show('scHome'); }; host.appendChild(home);
}

function openRecord(){
  const ids=Object.keys(LOG);
  let html='', txt=CURSTU+'　五年級數學｜互動教學抽離　學習紀錄　'+rocDate()+'\n';
  txt+='單元：倍數、整除與因數\n';
  txt+='鷹架設計：示範→提示→獨立三層，連續 2 題未達成自動退階，連續 3 題獨立正確自動晉階。\n';
  if(!ids.length){
    html='<div class="say">'+T('還沒有紀錄，先做一個章節。')+'</div>';
  }else{
    html+='<table class="rec"><tr><th>'+T('章節')+'</th><th>'+T('獨立')+'</th><th>'+T('提示')+
          '</th><th>'+T('示範')+'</th><th>'+T('未達成')+'</th><th>'+T('層級')+'</th></tr>';
    let TI=0,TH=0,TD=0,TF=0;
    ids.forEach(id=>{
      const r=LOG[id], x=r.res||{ind:0,hint:0,demo:0,fail:0};
      if(!r.title) r.title=(CHAPTERS.find(c=>c.id===r.id)||{}).title||r.id;
      if(r.startLv==null){ r.startLv=0; r.endLv=0; }
      if(!r.shifts) r.shifts=[];
      TI+=x.ind; TH+=x.hint; TD+=x.demo; TF+=x.fail;
      html+='<tr><td>'+T('【'+r.id+'】'+r.title)+'</td><td class="n">'+x.ind+'</td><td class="n">'+x.hint+
            '</td><td class="n">'+x.demo+'</td><td class="n">'+x.fail+'</td><td class="n">'+
            T(LV[r.startLv].name+'→'+LV[r.endLv].name)+'</td></tr>';
      const tot=x.ind+x.hint+x.demo+x.fail;
      const pc=tot?Math.round(x.ind/tot*100):0;
      txt+='\n【'+r.id+'】'+r.title+
           (r.mode==='teach'?'（完整教學：示範→引導→一題小確認）':
            r.mode==='drill'?'（動手練習）':'')+'\n';
      txt+='　獨立正確 '+x.ind+'　提示後正確 '+x.hint+'　示範後正確 '+x.demo+'　未達成 '+x.fail+'（共 '+tot+' 題）\n';
      txt+='　獨立完成率：'+pc+'%　評量結果：'+grade5(pc)+'\n';
      txt+='　鷹架層級：'+LV[r.startLv].name+' → '+LV[r.endLv].name;
      txt+=(r.shifts.length?('　異動：'+r.shifts.map(s=>s.at+(s.dir==='down'?' 退階至 ':' 晉階至 ')+s.to).join('；')):'　無異動');
      txt+='\n　評量提示層級：'+LV[r.endLv].code+'\n';
      if(r.mode==='drill'){
        const cl=r.detail.filter(d=>d.clean).length, jg=r.detail.filter(d=>d.judge).length;
        txt+='　直式一次填對：'+cl+' / '+r.nQ+'　整除判斷正確：'+jg+' / '+r.nQ+
             '　提示使用 '+r.hintsUsed+' 次\n';
        txt+='　題目：'+r.detail.map(d=>d.q+'（餘 '+d.r+'）').join('、')+'\n';
      }
    });
    html+='</table>';
    const tot=TI+TH+TD+TF, pc=tot?Math.round(TI/tot*100):0;
    txt+='\n合計：獨立 '+TI+'／提示 '+TH+'／示範 '+TD+'／未達成 '+TF+'（共 '+tot+' 題）\n';
    txt+='整體獨立完成率：'+pc+'%　評量結果：'+grade5(pc)+'\n';
    txt+='備註：本紀錄僅反映數學表現，未含課堂行為與出席狀況。\n';
    html+='<h3 style="font-size:1.02rem;line-height:2">'+T('可以直接複製到 IEP')+'</h3>';
  }
  html+='<textarea class="iep" id="iepBox" readonly>'+txt.replace(/</g,'&lt;')+'</textarea>';
  document.getElementById('recBody').innerHTML=html;
  show('scRec');
}
const CURSTU='學習者';
set('ldUnitLabel','動手練習');
set('btnDrillNm','✏️ 整除直式練習');
set('btnDrillMeta','自己填商、乘積、餘數，再判斷能不能整除（10 題）');
set('btnLdQuit','回首頁');
document.getElementById('btnDrill').addEventListener('click',()=>startDrill(false));
document.getElementById('btnLdQuit').addEventListener('click',()=>{ paintMenu(); show('scHome'); });
document.getElementById('btnRecord').addEventListener('click',openRecord);
document.getElementById('btnCopy').addEventListener('click',function(){
  const t=document.getElementById('iepBox'); if(!t) return;
  t.removeAttribute('readonly'); t.select(); t.setSelectionRange(0,99999);
  try{ document.execCommand('copy'); this.innerHTML=T('複製好了'); }
  catch(e){ this.innerHTML=T('請自己選取複製'); }
  t.setAttribute('readonly','readonly');
  setTimeout(()=>{ this.innerHTML=T('複製給 IEP 用'); },1800);
});

/* ==================================================================
   8. 自我檢查
   ================================================================== */
(function selfCheck(){
  const miss=new Set(), bad=[], N2=300;
  const strip=t=>String(t).replace(/<svg[\s\S]*?<\/svg>/g,'').replace(/<[^>]*>/g,'');
  const scan=t=>{ if(!t) return; for(const c of strip(t)) if(/[\u4e00-\u9fff]/.test(c)&&!ZH[c]) miss.add(c); };
  Object.keys(GEN).forEach(k=>{
    for(let i=0;i<N2;i++){
      const q=normalize(GEN[k]());
      scan(q.prompt); scan(q.hint); q.steps.forEach(scan);
      if(!q.mc.opts||q.mc.opts.length!==4) bad.push(k+' 選項數='+(q.mc.opts?q.mc.opts.length:0));
      else if(new Set(q.mc.opts).size!==4) bad.push(k+' 選項重複');
      if(!(q.mc.ans>=0&&q.mc.ans<4)) bad.push(k+' 正解遺失');
    }
  });
  CHAPTERS.forEach(c=>{ scan(c.unit); scan(c.title); scan(c.key); });
  /* 互動案例也要檢查：注音、選項、以及資料與題意是否一致 */
  Object.keys(CASES).forEach(k=>CASES[k].forEach(c=>{
    ['name','title','prompt','explain','intro'].forEach(f=>scan(c[f]));
    (c.opts||[]).forEach(scan);
    if(c.type==='choice' && !(c.ans>=0&&c.ans<c.opts.length)) bad.push(k+' '+c.name+' 正解超界');
    if(c.type==='line' && !(c.ans>=0&&c.ans<c.points.length)) bad.push(k+' '+c.name+' 正解超界');
    if(c.type==='groups' && ((c.total%c.per===0)!==c.yes)) bad.push(k+' '+c.name+' 餘數與答案不符');
  }));
  const msg=[];
  msg.push(miss.size?'缺少注音的字：'+Array.from(miss).join(' '):'注音檢查通過');
  msg.push(bad.length?'題目異常：'+Array.from(new Set(bad)).join('；'):'三章節檢查通過（每型試跑 '+N2+' 次）');
  (miss.size||bad.length)?console.warn(msg.join('\n')):console.log(msg.join('\n'));
})();
</script>
